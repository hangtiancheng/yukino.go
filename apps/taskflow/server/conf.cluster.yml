
server:
  host: 0.0.0.0
  port: 8090
  cors_allow_all: false
  api_token_env: TASKFLOW_API_TOKEN
  internal_token_env: TASKFLOW_INTERNAL_TOKEN
  read_timeout_seconds: 30
  write_timeout_seconds: 600

node:
  id: ""

mysql:
  host: mysql
  port: 3306
  user: root
  password_env: MYSQL_PASSWORD
  database: taskflow
  max_open_conns: 20
  max_idle_conns: 5
  replica_addresses: [mysql-replica:3306]

redis:
  address: redis:6379
  mode: sentinel
  addresses: [sentinel-1:26379, sentinel-2:26379, sentinel-3:26379]
  master_name: taskflow
  password: ""
  db: 0

llm:
  base_url_env: OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  model_env: OPENAI_MODEL
  default_model: gpt-4o-mini
  max_tool_rounds: 8
  request_timeout_seconds: 180
  max_output_tokens: 8192
  max_result_rows: 100
  allow_sql_writes: false
  redis_key_prefix: "taskflow:tools:"

scheduler:
  migrate_step_minutes: 60
  migrate_tick_seconds: 30
  claim_ttl_hours: 72
  stuck_running_minutes: 30
  overdue_recover_minutes: 2
  recover_workers: 8

mq:
  exec_topic: taskflow.exec.commands
  cond_topic: taskflow.cond.events
  exec_group: taskflow-exec
  cond_group: taskflow-cond
  msg_queue_len: 5000
  max_retry: 3

executor:
  workers: 4
  timeout_seconds: 600
  receive_timeout_ms: 1000
  handle_timeout_seconds: 900

cache:
  report_group: taskflow.reports
  report_cache_bytes_mib: 64
  report_expire_seconds: 600
  def_cache_expire_seconds: 60
  etcd_endpoints: "etcd-1:2379,etcd-2:2379,etcd-3:2379"
  cache_server_addr: ":9100"

reports:
  dir: /app/reports

journal:
  dir: /app/data/journal

consensus:
  id: 1

sentry:
  dsn_env: SENTRY_DSN
  environment: production
  release: taskflow@docker

telemetry:
  enabled: true
  exporter: file
  file_path: /app/logs/traces.jsonl
  client_log_path: /app/logs/client-events.jsonl
  sample_rate: 1.0
