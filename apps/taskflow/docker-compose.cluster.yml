services:
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.17
    restart: unless-stopped
    command:
      [
        "etcd",
        "--name=etcd-1",
        "--data-dir=/etcd-data",
        "--listen-client-urls=http://0.0.0.0:2379",
        "--advertise-client-urls=http://etcd-1:2379",
        "--listen-peer-urls=http://0.0.0.0:2380",
        "--initial-advertise-peer-urls=http://etcd-1:2380",
        "--initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380",
        "--initial-cluster-token=taskflow-cache",
      ]
    volumes: [etcd_1_data:/etcd-data]
    healthcheck:
      test:
        [
          "CMD",
          "etcdctl",
          "--endpoints=http://127.0.0.1:2379",
          "endpoint",
          "health",
        ]
      interval: 5s
      retries: 20

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.17
    restart: unless-stopped
    command:
      [
        "etcd",
        "--name=etcd-2",
        "--data-dir=/etcd-data",
        "--listen-client-urls=http://0.0.0.0:2379",
        "--advertise-client-urls=http://etcd-2:2379",
        "--listen-peer-urls=http://0.0.0.0:2380",
        "--initial-advertise-peer-urls=http://etcd-2:2380",
        "--initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380",
        "--initial-cluster-token=taskflow-cache",
      ]
    volumes: [etcd_2_data:/etcd-data]
    healthcheck:
      test:
        [
          "CMD",
          "etcdctl",
          "--endpoints=http://127.0.0.1:2379",
          "endpoint",
          "health",
        ]
      interval: 5s
      retries: 20

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.17
    restart: unless-stopped
    command:
      [
        "etcd",
        "--name=etcd-3",
        "--data-dir=/etcd-data",
        "--listen-client-urls=http://0.0.0.0:2379",
        "--advertise-client-urls=http://etcd-3:2379",
        "--listen-peer-urls=http://0.0.0.0:2380",
        "--initial-advertise-peer-urls=http://etcd-3:2380",
        "--initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380",
        "--initial-cluster-token=taskflow-cache",
      ]
    volumes: [etcd_3_data:/etcd-data]
    healthcheck:
      test:
        [
          "CMD",
          "etcdctl",
          "--endpoints=http://127.0.0.1:2379",
          "endpoint",
          "health",
        ]
      interval: 5s
      retries: 20

  mysql-replica:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-taskflow_secret}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: taskflow
    command:
      [
        "--server-id=2",
        "--log-bin=mysql-bin",
        "--relay-log=relay-bin",
        "--gtid-mode=ON",
        "--enforce-gtid-consistency=ON",
        "--binlog-format=ROW",
        "--log-replica-updates=ON",
        "--sync-binlog=1",
        "--innodb-flush-log-at-trx-commit=1",
      ]
    volumes:
      - mysql_replica_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -uroot -Nse 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      retries: 30
      start_period: 30s

  replication-init:
    image: mysql:8.4
    restart: "no"
    environment:
      MYSQL_PWD: ${MYSQL_PASSWORD:-taskflow_secret}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-taskflow_replication_secret}
    entrypoint: ["/bin/bash", "/bootstrap/mysql-replication.sh"]
    volumes:
      - ./deployment/mysql-replication.sh:/bootstrap/mysql-replication.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy

  redis-replica-1: &redis-replica
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "always",
        "--replicaof",
        "redis",
        "6379",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes: [redis_replica_1_data:/data]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli info replication | grep -Eq 'role:master|master_link_status:up'",
        ]
      interval: 5s
      retries: 30

  redis-replica-2:
    <<: *redis-replica
    volumes: [redis_replica_2_data:/data]

  sentinel-1: &sentinel
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/bootstrap/redis-sentinel.sh"]
    volumes:
      - ./deployment/redis-sentinel.sh:/bootstrap/redis-sentinel.sh:ro
      - sentinel_1_data:/data
    depends_on:
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      retries: 20

  sentinel-2:
    <<: *sentinel
    volumes:
      - ./deployment/redis-sentinel.sh:/bootstrap/redis-sentinel.sh:ro
      - sentinel_2_data:/data

  sentinel-3:
    <<: *sentinel
    volumes:
      - ./deployment/redis-sentinel.sh:/bootstrap/redis-sentinel.sh:ro
      - sentinel_3_data:/data

  server:
    volumes:
      - ./server/conf.cluster.yml:/app/conf.yml:ro
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
      replication-init:
        condition: service_completed_successfully
      sentinel-1:
        condition: service_healthy
      sentinel-2:
        condition: service_healthy
      sentinel-3:
        condition: service_healthy

  server-2:
    image: taskflow/server:latest
    restart: unless-stopped
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taskflow_secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SENTRY_DSN: ${SENTRY_DSN:-}
      TASKFLOW_API_TOKEN: ${TASKFLOW_API_TOKEN:-}
      TASKFLOW_INTERNAL_TOKEN: ${TASKFLOW_INTERNAL_TOKEN:-}
    volumes:
      - ./server/conf.cluster.yml:/app/conf.yml:ro
      - taskflow_reports:/app/reports
      - taskflow_journal_2:/app/data
      - taskflow_logs_2:/app/logs
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/api/v1/ready >/dev/null"]
      interval: 10s
      retries: 12

  client:
    volumes:
      - ./deployment/nginx.cluster.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server-2:
        condition: service_healthy

volumes:
  etcd_1_data:
  etcd_2_data:
  etcd_3_data:
  mysql_replica_data:
  redis_replica_1_data:
  redis_replica_2_data:
  sentinel_1_data:
  sentinel_2_data:
  sentinel_3_data:
  taskflow_journal_2:
  taskflow_logs_2:
