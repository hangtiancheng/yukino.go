

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/agent"
bin = "./tmp/main"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_ext = []
exclude_dir = ["tmp", "bin", "data", "node_modules"]
include_dir = []
exclude_regex = ["_test\\.go"]
delay = 1000
stop_on_error = true
send_interrupt_signal = true
kill_delay = 500

[log]
time = true

[misc]
clean_on_exit = true
